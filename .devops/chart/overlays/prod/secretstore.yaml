# Per-tenant ESO SecretStore + ServiceAccount (per-namespace isolation).
#
# Gives this namespace a NAMESPACED SecretStore (`vault-tenant`) authenticating to Vault
# as a tenant-scoped SA (`eso-tenant`) via the Vault k8s-auth role `tenant-springais`,
# whose policy is scoped to `secret/data/tenants/springais/*` ONLY. ESO's read on behalf of
# this tenant cannot reach another tenant's path or the platform path.
#
# Platform side (out-of-band, run once per onboarded team by the operator):
#   kubectl -n vault exec -i vault-0 -- sh -s -- springais prod \
#     < platform-services/external-secrets/vault-policies/tenant-role.sh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-tenant
  namespace: springais-prod
  labels:
    app.kubernetes.io/name: springais
    platform.capstone/component: tenant
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-tenant
  namespace: springais-prod
  labels:
    app.kubernetes.io/name: springais
    platform.capstone/component: tenant
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      # KV v2 engine mounted at `secret`; ESO appends the v2 `/data` segment itself.
      path: "secret"
      version: "v2"
      # A NAMESPACED SecretStore cannot reference a Secret in another namespace, so this
      # cannot caProvider the vault-server-tls Secret in the `vault` ns. CONTRACT (owned
      # by the platform's ESO/Vault onboarding): a ConfigMap `vault-ca` (key `ca.crt`) is
      # materialized in EVERY onboarded namespace before this store needs it.
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "tenant-springais"
          serviceAccountRef:
            name: eso-tenant
            audiences:
              - vault
