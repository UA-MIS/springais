# Auto-DB DATABASE_URL — ESO ExternalSecret. PLATFORM-OWNED contract, distinct from
# app-secret.externalsecret.yaml.
#
# PRODUCER (Crossplane): the CapstoneTenant Composition provisions a per-(team,env)
# PostgreSQL database + login role on capstone-tenant-pg and PushSecrets FOUR parts
# (username / password / host / port) to Vault at
# secret/data/tenants/springais/prod/database. The password is generated at runtime, so the
# parts — not a whole URL — live in Vault.
#
# CONSUMER (this file): reads those four parts and ASSEMBLES the DSN into the in-namespace
# Secret `springais-db` (key DATABASE_URL), which base/deployments.yaml envs into both the
# migration initContainer and the backend container.
#
# The dbname follows the platform's fixed structural rule <teamDb>_<env> (team slug with
# '-' -> '_'), set by the Composition's crossplane.io/external-name, so it is deterministic
# and NOT stored in Vault. For this tenant that is `springais_prod`.
#
# ⚠ SCHEME IS postgresql:// AND THAT IS ENOUGH. backend/app/database.py normalises a bare
# `postgresql://` (and `postgres://`) to the psycopg3 dialect `postgresql+psycopg://`
# itself, so the DSN does not need — and must not hardcode — a driver suffix here.
#
# ⚠ pgvector: the tenant login role is NOSUPERUSER and `vector` is trusted=f, so the app
# could not CREATE EXTENSION it. The tenant claim's `dbExtensions: [vector]` makes the
# platform install it superuser-side, per env, before this app's migrations run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: springais-db
  namespace: springais-prod
  labels:
    app.kubernetes.io/name: springais
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: springais-db
    creationPolicy: Owner
    # Retain, not Delete — same reasoning as app-secret: DATABASE_URL is a REQUIRED ref,
    # so a transient Vault read failure must not delete the Secret and take the running
    # backend down with it.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/springais_prod"
  data:
    - secretKey: username
      remoteRef:
        key: tenants/springais/prod/database
        property: username
    - secretKey: password
      remoteRef:
        key: tenants/springais/prod/database
        property: password
    - secretKey: host
      remoteRef:
        key: tenants/springais/prod/database
        property: host
    - secretKey: port
      remoteRef:
        key: tenants/springais/prod/database
        property: port
