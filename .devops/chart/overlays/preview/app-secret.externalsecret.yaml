# App secrets — ESO ExternalSecret. NAMES + Vault POINTERS only, never values.
#
# ESO reads from Vault at secret/data/tenants/springais/preview/app and materializes the
# in-namespace Secret `springais-secret`, which base/deployments.yaml envs into the backend.
#
# ⚠ NOTE THE ABSENCE OF `deletionPolicy: Delete` AND WHY THAT IS DELIBERATE.
# The platform template uses Delete so a missing Vault key is not an error and a
# freshly-scaffolded app still deploys ("zero-config"). This app is NOT zero-config: both
# keys below are REQUIRED secretKeyRefs in the base Deployment, because a SpringAIS
# backend without JWT_SECRET_KEY passes every health check and then 500s on every login,
# and one without OPENAI_API_KEY serves an empty match list. `deletionPolicy: Retain`
# keeps a previously-synced Secret in place if a later Vault read fails, so a transient
# Vault blip cannot delete the Secret out from under a running pod.
#
# ⚠ NEITHER VALUE IS IN GIT, AND NEITHER MAY EVER BE.
#   JWT_SECRET_KEY  — generate per env: openssl rand -hex 32
#   OPENAI_API_KEY  — the project's OpenAI key
# Write them with `vault kv put secret/tenants/springais/preview/app ...` or The Process
# "Secrets" tab. See .devops/secrets/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: springais-secret
  namespace: springais-preview
  labels:
    app.kubernetes.io/name: springais
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore
  target:
    name: springais-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: tenants/springais/preview/app
        property: JWT_SECRET_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: tenants/springais/preview/app
        property: OPENAI_API_KEY
