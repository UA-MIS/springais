# Dedicated ServiceAccount for the workload. The app needs no Kubernetes API access
# (least privilege), so no RBAC is bound and the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: springais
  labels:
    app.kubernetes.io/name: springais
automountServiceAccountToken: false
# Image pull from the PRIVATE Harbor project `springais`. The workload images live in
# a private project, so the pod needs the `harbor-pull` imagePullSecret or it
# ImagePullBackOffs. v1: `harbor-pull` is a dockerconfigjson Secret delivered by the
# platform (the tenant Composition's harbor-pull PushSecret -> Vault -> ESO), owned
# SOLELY by the platform side. The app overlays deliberately do NOT ship a copy — two
# owners of the same Secret trigger ArgoCD's SharedResourceWarning and block sync.
#
# NOTE: redis (chart/base/redis.yaml) runs a Docker Hub image, not a Harbor one. An
# imagePullSecret whose registry does not match the image ref is simply ignored by the
# kubelet, so listing harbor-pull here is harmless for that pod.
imagePullSecrets:
  - name: harbor-pull
