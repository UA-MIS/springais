# nginx server config for the SpringAIS SPA.
#
# This replaces a config that was previously generated by a multi-line `RUN echo '...'`
# inside the Dockerfile. It is a real file now for two reasons: the echo form silently
# mangles anything containing a quote or a `$`, and — more importantly — the config it
# produced had a health-check hole described below.
#
# Runs under nginxinc/nginx-unprivileged, which listens on 8080 as a non-root user and
# keeps its pid file and every temp path under /tmp. Do not "upgrade" this to the stock
# nginx image: that one writes /run/nginx.pid and needs a root-owned /var/cache/nginx, and
# will not start under the pod's readOnlyRootFilesystem + runAsUser 65532.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Uploaded resumes are posted to the BACKEND (/api/...), not here, so nginx never
    # receives a large body on this server. Left generous anyway so this is never the
    # component that 413s a request it merely proxies past.
    client_max_body_size 12m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # -----------------------------------------------------------------------
    # HEALTH CHECK — an EXACT-match location that can actually return non-200.
    # -----------------------------------------------------------------------
    # THE BUG THIS FIXES: the previous config had a single `location /` with
    # `try_files $uri $uri/ /index.html`. That is the correct SPA fallback, but it means
    # EVERY unmatched path returns index.html with status 200 — including /healthz. A
    # Kubernetes probe pointed there could not fail: nginx would report the pod Ready
    # while serving a broken, empty or entirely missing bundle. A health check that cannot
    # fail is worse than none, because it is mistaken for evidence.
    #
    # `location = /healthz` is an EXACT match, which nginx evaluates before any prefix
    # location, so it is never reached by the SPA fallback. It serves a real file written
    # by the Dockerfile's build stage AFTER `npm run build` succeeded, and `=404` means an
    # absent file (no build output) or an unreadable root (a filesystem/permission problem)
    # answers 404 and the pod is correctly held out of the Service.
    location = /healthz {
        try_files     /healthz =404;
        default_type  text/plain;
        access_log    off;
        add_header    Cache-Control "no-store" always;
    }

    # index.html must never be cached: it is the document that names the current
    # content-hashed bundle, so a cached copy pins a browser to a deployment that no
    # longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Vite emits content-hashed asset filenames, so these are safe to cache immutably.
    # The regex location is matched before the prefix `location /` below.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # SPA fallback — client-side routing. Deliberately LAST and deliberately a prefix
    # match, so the exact and regex locations above win.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
